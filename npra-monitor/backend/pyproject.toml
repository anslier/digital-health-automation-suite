[project]
name = "npra-monitor"
version = "0.1.0"
description = "Deterministic NPRA new-products monitor for the Big Caring assessment"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.16.5",
  "APScheduler==3.10.4",
  "fastapi==0.116.1",
  "pdfplumber==0.11.7",
  "playwright==1.55.0",
  "psycopg[binary]==3.2.10",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "SQLAlchemy==2.0.43",
  "typer==0.17.4",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "reportlab==4.4.4",
]

[project.scripts]
npra-monitor = "app.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
