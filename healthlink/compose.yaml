services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthlink}
      POSTGRES_USER: ${POSTGRES_USER:-healthlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthlink_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - healthlink_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-healthlink} -d ${POSTGRES_DB:-healthlink}"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-healthlink}:${POSTGRES_PASSWORD:-healthlink_dev}@postgres:5432/${POSTGRES_DB:-healthlink}?schema=public
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  healthlink_postgres_data:
